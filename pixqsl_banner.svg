  <line x1="256" y1="165" x2="256" y2="335" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
  
  <!-- Linhas de texto representadas no log -->
  <line x1="170" y1="225" x2="226" y2="213" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
  <line x1="170" y1="260" x2="226" y2="248" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
  <line x1="170" y1="295" x2="210" y2="285" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Selo de Assinatura Digital / Check (Verificado LoTW) -->

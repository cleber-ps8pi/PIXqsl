      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  
  <!-- Fundo do ícone com bordas arredondadas (padrão Android) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Ondas de rádio sutis no topo -->
  <path d="M176 135 C220 105, 292 105, 336 135" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" opacity="0.4"/>
  <path d="M200 163 C230 145, 282 145, 312 163" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" opacity="0.7"/>
  

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 90" width="480" height="90">
  <!-- Clean radio tower -->
  <g transform="translate(8,6)" fill="none" stroke="#7ED943" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- outer signal arc -->
    <path d="M30 22 C38 14 48 14 56 22" stroke="#8FE04A" stroke-width="2" opacity="0.35"/>
    <path d="M28 28 C34 22 42 22 48 28" stroke="#8FE04A" stroke-width="2.1" opacity="0.55"/>

    <!-- tower legs (lattice) -->
    <path d="M18 68 L26 18 L34 68" stroke="#7ED943" stroke-width="2.6"/>
    <!-- cross braces -->
    <path d="M20 56 L32 56" stroke="#6BCB3C" stroke-width="2"/>
    <path d="M21 44 L31 44" stroke="#6BCB3C" stroke-width="2"/>
    <path d="M22 32 L30 32" stroke="#6BCB3C" stroke-width="2"/>
    <!-- diagonal braces -->
    <path d="M20 56 L31 44" stroke="#6BCB3C" stroke-width="1.6" opacity="0.85"/>
    <path d="M32 56 L21 44" stroke="#6BCB3C" stroke-width="1.6" opacity="0.85"/>
    <path d="M21 44 L30 32" stroke="#6BCB3C" stroke-width="1.6" opacity="0.85"/>
    <path d="M31 44 L22 32" stroke="#6BCB3C" stroke-width="1.6" opacity="0.85"/>

    <!-- top element -->
    <circle cx="26" cy="14" r="4.2" fill="#8FE04A" stroke="none"/>
    <line x1="26" y1="18" x2="26" y2="22" stroke="#8FE04A" stroke-width="2.2"/>

    <!-- base -->
    <path d="M14 68 L38 68" stroke="#6BCB3C" stroke-width="3"/>
    <path d="M16 72 L36 72" stroke="#5AB832" stroke-width="2.5"/>
  </g>

  <text x="62" y="42" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-weight="800" font-size="34" fill="#8FE04A" letter-spacing="-1">PIXqsl</text>
  <text x="64" y="64" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-weight="500" font-size="13" fill="#6BCB3C">by Cleber (PS8PI)</text>
</svg>
